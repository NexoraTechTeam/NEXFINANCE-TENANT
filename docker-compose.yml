version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: nexfinance-db
    environment:
      POSTGRES_USER: nexfinance_user
      POSTGRES_PASSWORD: nexfinance_password
      POSTGRES_DB: nexfinance_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexfinance_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexfinance-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: nexfinance-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexfinance-network

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: nexfinance-backend
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://nexfinance_user:nexfinance_password@postgres:5432/nexfinance_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-jwt-secret-key-change-in-production
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app/backend
      - /app/backend/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - nexfinance-network

  # Frontend Application
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: nexfinance-frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
      REACT_APP_ENV: development
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - nexfinance-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: nexfinance-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployment/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    networks:
      - nexfinance-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  nexfinance-network:
    driver: bridge
