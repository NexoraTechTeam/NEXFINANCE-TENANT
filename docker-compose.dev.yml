services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexfinance-dev-backend
    restart: unless-stopped
    env_file:
      - .env.dev
    environment:
      NODE_ENV: development
      PORT: 5000
    networks:
      - web
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend-next
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://nexfinance-dev-backend:5000
    container_name: nexfinance-dev-frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://nexfinance-dev-backend:5000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.nexfinance-dev.rule=Host(`dev-nexfinance.nexoratech.co`)"
      - "traefik.http.routers.nexfinance-dev.entrypoints=websecure"
      - "traefik.http.routers.nexfinance-dev.tls.certresolver=myresolver"
      - "traefik.http.services.nexfinance-dev.loadbalancer.server.port=3000"
      - "traefik.http.routers.nexfinance-dev-http.rule=Host(`dev-nexfinance.nexoratech.co`)"
      - "traefik.http.routers.nexfinance-dev-http.entrypoints=web"
      - "traefik.http.routers.nexfinance-dev-http.middlewares=nexfinance-dev-https-redirect"
      - "traefik.http.middlewares.nexfinance-dev-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.nexfinance-dev-https-redirect.redirectscheme.permanent=true"

networks:
  web:
    external: true
    name: web
