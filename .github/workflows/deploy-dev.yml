name: Deploy NexFinance Dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: nexfinance-dev-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Test Dev Branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        env:
          JWT_SECRET: test-jwt-secret-do-not-use-in-production
          NODE_ENV: test
        run: npm test

      - name: Install frontend dependencies
        working-directory: frontend-next
        run: npm ci

      - name: Lint frontend
        working-directory: frontend-next
        run: npm run lint

      - name: Test frontend
        working-directory: frontend-next
        run: npm test

      - name: Verify dev isolation contract
        run: |
          set -e
          grep -q 'nexfinance-dev-backend' docker-compose.dev.yml
          grep -q 'nexfinance-dev-frontend' docker-compose.dev.yml
          grep -q 'dev-nexfinance.nexoratech.co' docker-compose.dev.yml
          ! grep -qE 'container_name: nexfinance-backend$' docker-compose.dev.yml
          ! grep -qE 'container_name: nexfinance-frontend$' docker-compose.dev.yml
          ! grep -qE 'Host\(`nexfinance\.nexoratech\.co`\)' docker-compose.dev.yml

  deploy:
    name: Build & Deploy Dev to VPS
    runs-on: self-hosted
    needs: test
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate required dev secret
        env:
          DEV_JWT_SECRET: ${{ secrets.NEXFINANCE_DEV_JWT_SECRET }}
        run: test -n "$DEV_JWT_SECRET"

      - name: Sync code and configure isolated environment
        env:
          DEV_JWT_SECRET: ${{ secrets.NEXFINANCE_DEV_JWT_SECRET }}
        run: |
          set -e
          APP_DIR="/home/github-runner/apps/nexfinance-dev"
          mkdir -p "$APP_DIR"
          rsync -a --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            "$GITHUB_WORKSPACE/" "$APP_DIR/"
          umask 077
          printf 'JWT_SECRET=%s\n' "$DEV_JWT_SECRET" > "$APP_DIR/.env.dev"

      - name: Build and restart isolated dev stack
        run: |
          set -e
          cd /home/github-runner/apps/nexfinance-dev
          docker compose -p nexfinance-dev -f docker-compose.dev.yml build --no-cache
          docker compose -p nexfinance-dev -f docker-compose.dev.yml up -d --remove-orphans

      - name: Wait for dev backend and frontend
        run: |
          set -e
          cd /home/github-runner/apps/nexfinance-dev
          for i in $(seq 1 12); do
            if docker exec nexfinance-dev-backend curl -sf http://localhost:5000/health >/dev/null; then break; fi
            if [ "$i" -eq 12 ]; then docker compose -p nexfinance-dev -f docker-compose.dev.yml logs --tail=50; exit 1; fi
            sleep 5
          done
          for i in $(seq 1 12); do
            if docker exec nexfinance-dev-frontend curl -sf http://localhost:3000/login >/dev/null; then break; fi
            if [ "$i" -eq 12 ]; then docker compose -p nexfinance-dev -f docker-compose.dev.yml logs --tail=50; exit 1; fi
            sleep 5
          done

      - name: Smoke test dev domain and isolation
        run: |
          set -e
          LOGIN_HTML="/tmp/nexfinance-dev-login.html"
          LOGIN_STATUS=""

          for attempt in $(seq 1 12); do
            LOGIN_STATUS="$(curl -sS -o "$LOGIN_HTML" -w '%{http_code}' --max-time 15 https://dev-nexfinance.nexoratech.co/login || true)"
            if [ "$LOGIN_STATUS" = 200 ]; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Dev login smoke check failed with HTTP ${LOGIN_STATUS:-curl-error}"
              docker compose -p nexfinance-dev -f /home/github-runner/apps/nexfinance-dev/docker-compose.dev.yml logs --tail=80
              exit 1
            fi
            sleep 5
          done

          if grep -q 'Demo credentials' "$LOGIN_HTML"; then
            echo "Dev login page still exposes demo credentials"
            exit 1
          fi

          BACKEND_RUNNING="$(docker inspect -f '{{.State.Running}}' nexfinance-dev-backend 2>/dev/null || true)"
          FRONTEND_RUNNING="$(docker inspect -f '{{.State.Running}}' nexfinance-dev-frontend 2>/dev/null || true)"
          if [ "$BACKEND_RUNNING" != true ]; then
            echo "Dev backend container is not running: ${BACKEND_RUNNING:-missing}"
            exit 1
          fi
          if [ "$FRONTEND_RUNNING" != true ]; then
            echo "Dev frontend container is not running: ${FRONTEND_RUNNING:-missing}"
            exit 1
          fi
