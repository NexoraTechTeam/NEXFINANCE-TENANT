name: Deploy NexFinance

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  # ── Stage 1: Run tests ──────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        env:
          JWT_SECRET: test-jwt-secret-do-not-use-in-production
          NODE_ENV: test
        run: npm test

      - name: Install frontend dependencies
        working-directory: frontend-next
        run: npm ci

      - name: Lint frontend
        working-directory: frontend-next
        run: npm run lint

  # ── Stage 2: Deploy (only after tests pass) ─────────────────────────────────
  deploy:
    name: Build & Deploy to VPS
    runs-on: self-hosted
    needs: test
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Build & restart containers (runner runs directly on VPS) ───────────
      - name: Build & restart containers
        run: |
          set -e
          APP_DIR="/root/nexora-node/apps/nexfinance"

          echo "▶ Syncing code..."
          rsync -a --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            "$GITHUB_WORKSPACE/" "$APP_DIR/"

          cd "$APP_DIR"

          echo "▶ Building Docker images..."
          docker compose -f docker-compose.prod.yml build --no-cache

          echo "▶ Restarting containers..."
          docker compose -f docker-compose.prod.yml up -d --remove-orphans

          echo "▶ Waiting for backend to be healthy (up to 60s)..."
          for i in $(seq 1 12); do
            if docker exec nexfinance-backend curl -sf http://localhost:5000/health > /dev/null 2>&1; then
              echo "✓ Backend healthy after $((i * 5))s"
              break
            fi
            if [ "$i" -eq 12 ]; then
              echo "❌ Backend health check timed out after 60s"
              docker compose -f docker-compose.prod.yml logs backend --tail=50
              exit 1
            fi
            echo "  Waiting... ($((i * 5))s elapsed)"
            sleep 5
          done

          echo "▶ Waiting for frontend to be healthy (up to 60s)..."
          for i in $(seq 1 12); do
            if docker exec nexfinance-frontend curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "✓ Frontend healthy after $((i * 5))s"
              break
            fi
            if [ "$i" -eq 12 ]; then
              echo "❌ Frontend health check timed out after 60s"
              docker compose -f docker-compose.prod.yml logs frontend --tail=50
              exit 1
            fi
            echo "  Waiting... ($((i * 5))s elapsed)"
            sleep 5
          done

          echo "▶ Container status:"
          docker compose -f docker-compose.prod.yml ps

          echo "✅ NexFinance deployed → https://nexfinance.nexoratech.co"

      # ── External smoke test ────────────────────────────────────────────────
      - name: Smoke test live URL
        run: |
          echo "▶ Smoke testing https://nexfinance.nexoratech.co ..."
          for i in 1 2 3 4 5; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
              https://nexfinance.nexoratech.co)
            echo "  Attempt $i: HTTP $HTTP_CODE"
            # 200=ok, 301/302/307/308=redirect (valid — Next.js / → /login is 307)
            if echo "$HTTP_CODE" | grep -qE "^(200|301|302|307|308)$"; then
              echo "✅ Live URL is responding (HTTP $HTTP_CODE)"
              exit 0
            fi
            sleep 10
          done
          echo "❌ Live URL smoke test failed after 5 attempts"
          exit 1
