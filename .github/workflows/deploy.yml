name: Deploy NexFinance

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  # ── Stage 1: Run tests ──────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        env:
          JWT_SECRET: test-secret-for-ci
          NODE_ENV: test
        run: npm test

      - name: Install frontend dependencies
        working-directory: frontend-next
        run: npm ci

      - name: Lint frontend
        working-directory: frontend-next
        run: npm run lint

  # ── Stage 2: Deploy (only after tests pass) ─────────────────────────────────
  deploy:
    name: Build & Deploy to VPS
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Sync code to VPS via rsync over SSH ────────────────────────────────
      - name: Install sshpass
        run: sudo apt-get install -y sshpass rsync

      - name: Sync code to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          VPS_APP_PATH: ${{ secrets.VPS_APP_PATH }}
        run: |
          APP_DIR="$VPS_APP_PATH/nexfinance"
          # Create app dir if missing
          sshpass -p "$VPS_PASSWORD" ssh -o StrictHostKeyChecking=no \
            "$VPS_USER@$VPS_HOST" "mkdir -p $APP_DIR"
          # Rsync all files (exclude .git, node_modules, build artifacts)
          sshpass -p "$VPS_PASSWORD" rsync -az --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='frontend/build' \
            --exclude='.next' \
            --exclude='.env' \
            --filter='protect .env' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ "$VPS_USER@$VPS_HOST:$APP_DIR/"

      # ── Build & restart containers ──────────────────────────────────────────
      - name: Build & restart containers
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          command_timeout: 15m
          script_stop: true
          script: |
            set -e
            APP_DIR="${{ secrets.VPS_APP_PATH }}/nexfinance"
            cd "$APP_DIR"

            echo "▶ Ensuring .env exists..."
            if [ ! -f ".env" ]; then
              cp .env.prod.example .env
              echo "JWT_SECRET=$(openssl rand -hex 32)" >> .env
              echo "⚠  .env auto-created with random JWT_SECRET"
            fi

            echo "▶ Building Docker images..."
            docker compose -f docker-compose.prod.yml build --no-cache

            echo "▶ Restarting containers..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "▶ Waiting 20s for startup..."
            sleep 20

            echo "▶ Container status:"
            docker compose -f docker-compose.prod.yml ps

            echo "▶ Backend health check..."
            docker exec nexfinance-backend curl -sf http://localhost:5000/health \
              || (echo "❌ Backend health check failed" && exit 1)

            echo "▶ Frontend health check..."
            docker exec nexfinance-frontend curl -sf http://localhost:3000 \
              || (echo "❌ Frontend health check failed" && exit 1)

            echo "✅ NexFinance deployed → https://nexfinance.nexoratech.co"
