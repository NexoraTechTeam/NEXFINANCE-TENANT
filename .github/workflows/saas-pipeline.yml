name: SaaS pipeline (reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment holding secrets/vars (staging | production)
        type: string
        required: true
      stack:
        description: Docker compose project / container prefix (must start with nexfin-saas)
        type: string
        required: true

jobs:
  test:
    name: Test & contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexfin_saas_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend-next/package-lock.json

      - name: Isolation contract (never touch NexFinance stacks) + deploy script tests
        run: |
          sh deploy/check-isolation.sh
          for t in deploy/tests/*.test.sh scripts/tests/*.test.sh; do sh "$t"; done

      - name: Backend — install, lint, test
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/nexfin_saas_test
          JWT_SECRET: test-jwt-secret-do-not-use-in-production
        run: |
          npm ci
          npx eslint src scripts
          npm test

      - name: Frontend — install, lint, test
        working-directory: frontend-next
        run: |
          npm ci
          npm run lint
          npm test

      - name: Compose file is valid
        env:
          STACK: ${{ inputs.stack }}
          DB_PASSWORD: ci
          JWT_SECRET: ci
          CONSOLE_HOSTS: console.example.test
          TENANT_BASE_DOMAIN: example.test
          SAAS_TRAEFIK_RULE: Host(`console.example.test`)
        run: |
          docker compose -p "$STACK" -f docker-compose.saas.yml config -q
          sh deploy/compose-custom.sh "$STACK" school.example.test > /tmp/custom-domains.yml
          docker compose -p "$STACK" -f docker-compose.saas.yml -f /tmp/custom-domains.yml config -q

  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: self-hosted
    needs: test
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    concurrency:
      group: ${{ inputs.stack }}-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      STACK: ${{ inputs.stack }}
      APP_DIR: /home/github-runner/apps/${{ inputs.stack }}
    steps:
      - uses: actions/checkout@v4

      - name: Guard stack name and target directory
        run: |
          set -e
          case "$STACK" in nexfin-saas*) ;; *) echo "Refusing stack '$STACK'"; exit 1 ;; esac
          case "$APP_DIR" in /home/github-runner/apps/nexfin-saas*) ;; *) echo "Refusing APP_DIR '$APP_DIR'"; exit 1 ;; esac

      - name: Resolve settings and secrets (GitHub values win, otherwise defaults / persisted on the VPS)
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          SAAS_HOSTS: ${{ vars.SAAS_HOSTS }}
          SAAS_CUSTOM_HOSTS: ${{ vars.SAAS_CUSTOM_HOSTS }}
          CONSOLE_HOSTS: ${{ vars.CONSOLE_HOSTS }}
          TENANT_BASE_DOMAIN: ${{ vars.TENANT_BASE_DOMAIN }}
          ONBOARD_TENANTS: ${{ vars.ONBOARD_TENANTS }}
          DEMO_TENANT_HOSTS: ${{ vars.DEMO_TENANT_HOSTS }}
          CONSOLE_ADMIN_EMAIL: ${{ secrets.SAAS_CONSOLE_ADMIN_EMAIL }}
          GH_JWT_SECRET: ${{ secrets.SAAS_JWT_SECRET }}
          GH_DB_PASSWORD: ${{ secrets.SAAS_DB_PASSWORD }}
          GH_CONSOLE_ADMIN_PASSWORD: ${{ secrets.SAAS_CONSOLE_ADMIN_PASSWORD }}
        run: |
          set -e
          SECRETS_DIR="/home/github-runner/apps/$STACK.secrets"
          case "$SECRETS_DIR" in /home/github-runner/apps/nexfin-saas*.secrets) ;; *) echo "Refusing $SECRETS_DIR"; exit 1 ;; esac
          settings="$(sh deploy/env-defaults.sh "$ENVIRONMENT")"
          echo "$settings"
          echo "$settings" >> "$GITHUB_ENV"
          SAAS_HOSTS="$(echo "$settings" | grep '^SAAS_HOSTS=' | cut -d= -f2-)"
          sh deploy/traefik-rule.sh "$SAAS_HOSTS" >/dev/null
          JWT_SECRET="$(sh deploy/ensure-secret.sh "$SECRETS_DIR/jwt_secret" "$GH_JWT_SECRET")"
          # Postgres keeps the password it was initialised with: once stored on the VPS it is never replaced.
          [ -s "$SECRETS_DIR/db_password" ] && GH_DB_PASSWORD=""
          DB_PASSWORD="$(sh deploy/ensure-secret.sh "$SECRETS_DIR/db_password" "$GH_DB_PASSWORD")"
          CONSOLE_ADMIN_PASSWORD="$(sh deploy/ensure-secret.sh "$SECRETS_DIR/console_admin_password" "$GH_CONSOLE_ADMIN_PASSWORD")"
          for v in JWT_SECRET DB_PASSWORD CONSOLE_ADMIN_PASSWORD; do
            eval "val=\$$v"; echo "::add-mask::$val"; echo "$v=$val" >> "$GITHUB_ENV"
          done
          echo "Console admin password is stored on the VPS in $SECRETS_DIR/console_admin_password (used only for the first operator)."

      - name: Record running NexFinance containers (must stay untouched)
        run: |
          for c in nexfinance-backend nexfinance-frontend nexfinance-dev-backend nexfinance-dev-frontend; do # isolation:allow (read-only check)
            docker inspect -f '{{.Name}} {{.State.StartedAt}}' "$c" 2>/dev/null || true
          done > /tmp/${STACK}-neighbours.before

      - name: Sync code and write environment
        run: |
          set -e
          RULE="$(sh deploy/traefik-rule.sh "$SAAS_HOSTS")"
          # Schools' own domains get their own router + certificate, and only once their DNS points at this VPS.
          LIVE_CUSTOM="$(sh deploy/custom-domains.sh "$SAAS_CUSTOM_HOSTS" "${CONSOLE_HOSTS%%,*}")"
          echo "LIVE_CUSTOM_HOSTS=$LIVE_CUSTOM" >> "$GITHUB_ENV"
          echo "custom domains configured: ${SAAS_CUSTOM_HOSTS:-none}; routed now (DNS → this VPS): ${LIVE_CUSTOM:-none}"
          mkdir -p "$APP_DIR"
          rsync -a --delete --exclude='.git' --exclude='node_modules' --exclude='.next' --exclude='.env.saas' \
            "$GITHUB_WORKSPACE/" "$APP_DIR/"
          umask 077
          {
            printf 'STACK=%s\n' "$STACK"
            printf 'SAAS_TRAEFIK_RULE=%s\n' "$RULE"
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
            printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD"
            printf 'CONSOLE_HOSTS=%s\n' "$CONSOLE_HOSTS"
            printf 'TENANT_BASE_DOMAIN=%s\n' "$TENANT_BASE_DOMAIN"
            printf 'CONSOLE_ADMIN_EMAIL=%s\n' "$CONSOLE_ADMIN_EMAIL"
            printf 'CONSOLE_ADMIN_PASSWORD=%s\n' "$CONSOLE_ADMIN_PASSWORD"
            printf 'DEMO_TENANT_HOSTS=%s\n' "$DEMO_TENANT_HOSTS"
          } > "$APP_DIR/.env.saas"
          if [ -n "$LIVE_CUSTOM" ]; then
            sh deploy/compose-custom.sh "$STACK" "$LIVE_CUSTOM" > "$APP_DIR/docker-compose.custom-domains.yml"
          else
            rm -f "$APP_DIR/docker-compose.custom-domains.yml"
          fi

      - name: Build and start stack
        run: |
          set -e
          cd "$APP_DIR"
          files="-f docker-compose.saas.yml"
          [ -f docker-compose.custom-domains.yml ] && files="$files -f docker-compose.custom-domains.yml"
          docker compose -p "$STACK" --env-file .env.saas $files build
          docker compose -p "$STACK" --env-file .env.saas $files up -d --remove-orphans

      - name: Wait for backend and frontend
        run: |
          set -e
          for i in $(seq 1 24); do
            docker exec "$STACK-backend" curl -sf http://127.0.0.1:5000/health >/dev/null && break
            [ "$i" -eq 24 ] && { docker exec "$STACK-backend" curl -sS http://127.0.0.1:5000/health 2>&1 | tail -3; cd "$APP_DIR"; docker compose -p "$STACK" --env-file .env.saas -f docker-compose.saas.yml logs --tail=80; exit 1; }
            sleep 5
          done
          for i in $(seq 1 24); do
            docker exec "$STACK-frontend" wget -qO- http://127.0.0.1:3000/login >/dev/null 2>&1 && break
            [ "$i" -eq 24 ] && { docker exec "$STACK-frontend" wget -O- http://127.0.0.1:3000/login 2>&1 | tail -3; cd "$APP_DIR"; docker compose -p "$STACK" --env-file .env.saas -f docker-compose.saas.yml logs --tail=80; exit 1; }
            sleep 5
          done

      - name: Onboard tenants from docs/tenants (idempotent)
        run: |
          set -e
          for slug in $(echo "$ONBOARD_TENANTS" | tr ',' ' '); do
            case "$slug" in *[!a-z0-9-]* | "") echo "invalid slug: $slug"; exit 1 ;; esac
            [ -f "$APP_DIR/docs/tenants/$slug/tenant.json" ] || { echo "missing docs/tenants/$slug/tenant.json"; exit 1; }
            docker exec "$STACK-backend" rm -rf "/tmp/onboard-$slug"
            docker cp "$APP_DIR/docs/tenants/$slug" "$STACK-backend:/tmp/onboard-$slug"
            # The one-time admin password is never printed here; issue it from Console → Reset password.
            docker exec "$STACK-backend" node scripts/onboard-tenant.js --if-missing --no-password "/tmp/onboard-$slug/tenant.json"
          done

      - name: Smoke test every host
        run: |
          set -e
          for host in $(echo "$SAAS_HOSTS,$SAAS_CUSTOM_HOSTS" | tr ',' ' '); do
            case ",$SAAS_CUSTOM_HOSTS," in *",$host,"*)
              case ",$LIVE_CUSTOM_HOSTS," in *",$host,"*) ;; *)
                docker exec "$STACK-backend" curl -sf -H "x-forwarded-host: $host" http://127.0.0.1:5000/api/v1/tenant/config >/dev/null \
                  && echo "✓ tenant registered for $host (⚠ DNS not pointing at this VPS yet — not routed)" || { echo "✗ no active tenant for $host"; exit 1; }
                continue ;;
              esac ;;
            esac
            case ",$CONSOLE_HOSTS," in *",$host,"*) path=/console ;; *) path=/login ;; esac
            # Inside the stack first (works before DNS exists), then through Traefik + TLS when DNS resolves.
            docker exec "$STACK-frontend" wget -qO /dev/null --header "Host: $host" "http://127.0.0.1:3000$path" \
              && echo "✓ internal $host$path" || { echo "✗ internal $host$path"; exit 1; }
            if [ "$path" = /login ]; then
              docker exec "$STACK-backend" curl -sf -H "x-forwarded-host: $host" http://127.0.0.1:5000/api/v1/tenant/config >/dev/null \
                && echo "✓ tenant registered for $host" || { echo "✗ no active tenant for $host"; exit 1; }
            fi
            if ! getent hosts "$host" >/dev/null; then echo "⚠ no DNS record for $host yet — public check skipped"; continue; fi
            for attempt in $(seq 1 24); do
              code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "https://$host$path" || true)"
              [ "$code" = 200 ] && { echo "✓ https://$host$path"; break; }
              [ "$attempt" -eq 24 ] && { echo "✗ https://$host$path → ${code:-curl-error}"; exit 1; }
              sleep 5
            done
          done

      - name: Verify NexFinance containers were not restarted
        run: |
          for c in nexfinance-backend nexfinance-frontend nexfinance-dev-backend nexfinance-dev-frontend; do # isolation:allow (read-only check)
            docker inspect -f '{{.Name}} {{.State.StartedAt}}' "$c" 2>/dev/null || true
          done > /tmp/${STACK}-neighbours.after
          diff -u /tmp/${STACK}-neighbours.before /tmp/${STACK}-neighbours.after
          echo "✓ NexFinance stacks untouched"
