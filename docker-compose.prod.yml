services:
  # ─── Backend API ─────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexfinance-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - web
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Frontend (Next.js) ───────────────────────────────────
  frontend:
    build:
      context: ./frontend-next
      dockerfile: Dockerfile
    container_name: nexfinance-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.nexfinance.rule=Host(`nexfinance.nexoratech.co`)"
      - "traefik.http.routers.nexfinance.entrypoints=websecure"
      - "traefik.http.routers.nexfinance.tls.certresolver=myresolver"
      - "traefik.http.services.nexfinance.loadbalancer.server.port=3000"
      # HTTP → HTTPS redirect
      - "traefik.http.routers.nexfinance-http.rule=Host(`nexfinance.nexoratech.co`)"
      - "traefik.http.routers.nexfinance-http.entrypoints=web"
      - "traefik.http.routers.nexfinance-http.middlewares=nexfinance-https-redirect"
      - "traefik.http.middlewares.nexfinance-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.nexfinance-https-redirect.redirectscheme.permanent=true"

networks:
  web:
    external: true
    name: web
